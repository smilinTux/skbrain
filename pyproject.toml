[project]
name = "skbrain"
version = "1.0.2"
description = "The skbrain framework: a git-canon operations brain (runbooks, known errors, postmortems, CMDB definitions) projected into Postgres for retrieval."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    # No upper caps (tested 2026-11-15 on click 8.1.8 to 8.5.1, typer 0.16 to
    # 0.29). The typer floor is real: typer < 0.16 breaks on click >= 8.2
    # (13 CLI tests fail, `skbrain --help` raises), so a resolver must never
    # pair an old typer with a new click.
    "typer>=0.16",
    "click>=8.1",
    "pyyaml>=6.0",
    "requests>=2.32",
    "psycopg[binary]>=3.2",
    "jsonschema>=4.20",
]

[project.scripts]
skbrain = "skbrain.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skbrain"]

# The schemas live at the repo root (canonical); the wheel carries them inside the
# package so an installed skbrain can run `skbrain check` without a checkout.
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "skbrain/_data/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
